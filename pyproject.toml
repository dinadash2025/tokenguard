[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenguard"
version = "0.1.0"
description = "Autonomous LLM FinOps & Cost Intelligence Gateway"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
[project.scripts]
tokenguard = "tokenguard.cli:main"
